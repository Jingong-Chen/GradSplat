[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gradsplat"
version = "1.0.0"
description = "GradSplat: gradients inside the forward pass for feed-forward 3D Gaussian Splatting"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT AND LicenseRef-FAIR-Noncommercial-Research-License"}
authors = [
    {name = "Jingong Chen"}, {name = "Linlian Jiang"}, {name = "Guangyuan Li"}, {name = "Xinxin Zuo"},
    {name = "Yang Wang"}, {name = "Chulwoo Pack"}, {name = "Kyle Gao"}, {name = "Kwanghee Won"},
]
keywords = ["3d gaussian splatting", "novel view synthesis", "feed-forward", "3d reconstruction"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "torch>=2.3",
    "numpy",
    "Pillow",
    "safetensors",
    "huggingface_hub>=0.23",
    "gsplat>=1.4",
    "plyfile",
    "imageio[ffmpeg]",
]

[project.optional-dependencies]
demo = ["gradio>=5.31,<6", "av"]
eval = ["lpips", "torchvision"]
dev = ["pytest"]

[project.urls]
Homepage = "https://jingong-chen.github.io/GradSplat/"
Repository = "https://github.com/Jingong-Chen/GradSplat"
Paper = "https://arxiv.org/abs/2610.38951"
Weights = "https://huggingface.co/Jingong/GradSplat"

[tool.setuptools.packages.find]
where = ["."]
include = ["gradsplat*"]

[tool.setuptools.package-data]
"gradsplat._vggt_omega" = ["LICENSE", "LICENSE_DINOv3.md"]
